<section class="panel panel__text panel--ai-biography">
  <details class="ai-biography-details" open>
    <summary>
      <h2>About {{personName}} <span class="ai-badge">AI</span></h2>
    </summary>
    <p class="ai-disclaimer">
      This text was generated by AI using data from our collection records{{#if hasWikidata}} and Wikidata{{/if}}. It may contain inaccuracies.
      <a href="mailto:web.team@sciencemuseum.ac.uk">Report an issue</a>
    </p>
    <div class="ai-biography__section">
      {{{biography}}}
    </div>
    {{#if context}}
    <hr class="ai-biography__divider">
    <div class="ai-biography__section ai-biography__context">
      <h3>In the collection</h3>
      {{{context}}}
    </div>
    {{/if}}
  </details>
</section>
